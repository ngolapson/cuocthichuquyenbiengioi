    <script>
      // Defensive guard against packages or polyfills attempting to reassign window.fetch
      // when fetch is defined as a non-writable/getter-only property in certain preview environments
      (function() {
        try {
          var nativeFetch = window.fetch;
          var fetchDescriptor = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                                Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (fetchDescriptor && !fetchDescriptor.writable && !fetchDescriptor.set) {
            var currentFetch = nativeFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; }
            });
          }
        } catch (e) {
          // Ignore if cannot be redefined
        }
      })();
    </script>
